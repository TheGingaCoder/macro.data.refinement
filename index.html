<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Macro Data Refinement</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="terminal-shell">
    <header class="terminal-header">
      <div class="company-identity">
        <span class="company-mark" aria-hidden="true">◇</span>
        <span class="company-name">AURELIS DATA DIVISION</span>
      </div>

      <div class="file-status">
        <span class="file-name">WOODLAND</span>
        <span class="file-progress">0%</span>
        <span class="system-indicator" aria-label="System nominal"></span>
      </div>
    </header>

    <section class="data-viewport" aria-label="Refinement data field">
      <p class="viewport-status">DATA FIELD READY</p>
    </section>

    <footer class="refinement-bins" aria-label="Refinement bins">
      <div class="refinement-bin" data-bin="01">
        <span class="bin-number">01</span>
        <div class="bin-progress-track"><div class="bin-progress-fill"></div></div>
        <span class="bin-percentage">0%</span>
      </div>

      <div class="refinement-bin" data-bin="02">
        <span class="bin-number">02</span>
        <div class="bin-progress-track"><div class="bin-progress-fill"></div></div>
        <span class="bin-percentage">0%</span>
      </div>

      <div class="refinement-bin" data-bin="03">
        <span class="bin-number">03</span>
        <div class="bin-progress-track"><div class="bin-progress-fill"></div></div>
        <span class="bin-percentage">0%</span>
      </div>

      <div class="refinement-bin" data-bin="04">
        <span class="bin-number">04</span>
        <div class="bin-progress-track"><div class="bin-progress-fill"></div></div>
        <span class="bin-percentage">0%</span>
      </div>

      <div class="refinement-bin" data-bin="05">
        <span class="bin-number">05</span>
        <div class="bin-progress-track"><div class="bin-progress-fill"></div></div>
        <span class="bin-percentage">0%</span>
      </div>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
