<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Macro Data Refinement</title>
  <link rel="stylesheet" href="styles.css?v=13" />
</head>
<body>
  <main class="terminal-shell">
    <header class="terminal-header">
      <div class="file-panel">NARVA</div>

      <div class="completion-panel">
        <span id="fileProgress">48%</span> Complete
      </div>

      <div class="brand-panel" aria-label="Macro Data Refinement">
        <span class="brand-orbit brand-orbit-a"></span>
        <span class="brand-orbit brand-orbit-b"></span>
        <span class="brand-word">MACRO</span>
      </div>
    </header>

    <section class="data-viewport" id="dataViewport" aria-label="Refinement data field">
      <div class="number-world" id="numberWorld"></div>
      <div class="selection-box" id="selectionBox" aria-hidden="true"></div>

      <div class="zoom-readout" id="zoomReadout" aria-live="polite">100%</div>
    </section>

    <footer class="refinement-footer">
      <div class="refinement-bins" id="refinementBins">
        <div class="refinement-bin" data-bin="00" data-progress="43">
          <div class="temper-panel" aria-hidden="true">
            <div class="temper-row temper-wo"><span>WO</span><div class="temper-track"><div class="temper-fill"></div></div></div>
            <div class="temper-row temper-fc"><span>FC</span><div class="temper-track"><div class="temper-fill"></div></div></div>
            <div class="temper-row temper-dr"><span>DR</span><div class="temper-track"><div class="temper-fill"></div></div></div>
            <div class="temper-row temper-ma"><span>MA</span><div class="temper-track"><div class="temper-fill"></div></div></div>
          </div>
          <div class="bin-label">00</div>
          <div class="bin-meter">
            <div class="bin-fill"></div>
            <span class="bin-value">43%</span>
          </div>
        </div>

        <div class="refinement-bin" data-bin="01" data-progress="25">
          <div class="temper-panel" aria-hidden="true">
            <div class="temper-row temper-wo"><span>WO</span><div class="temper-track"><div class="temper-fill"></div></div></div>
            <div class="temper-row temper-fc"><span>FC</span><div class="temper-track"><div class="temper-fill"></div></div></div>
            <div class="temper-row temper-dr"><span>DR</span><div class="temper-track"><div class="temper-fill"></div></div></div>
            <div class="temper-row temper-ma"><span>MA</span><div class="temper-track"><div class="temper-fill"></div></div></div>
          </div>
          <div class="bin-label">01</div>
          <div class="bin-meter">
            <div class="bin-fill"></div>
            <span class="bin-value">25%</span>
          </div>
        </div>

        <div class="refinement-bin" data-bin="02" data-progress="37">
          <div class="temper-panel" aria-hidden="true">
            <div class="temper-row temper-wo"><span>WO</span><div class="temper-track"><div class="temper-fill"></div></div></div>
            <div class="temper-row temper-fc"><span>FC</span><div class="temper-track"><div class="temper-fill"></div></div></div>
            <div class="temper-row temper-dr"><span>DR</span><div class="temper-track"><div class="temper-fill"></div></div></div>
            <div class="temper-row temper-ma"><span>MA</span><div class="temper-track"><div class="temper-fill"></div></div></div>
          </div>
          <div class="bin-label">02</div>
          <div class="bin-meter">
            <div class="bin-fill"></div>
            <span class="bin-value">37%</span>
          </div>
        </div>

        <div class="refinement-bin" data-bin="03" data-progress="76">
          <div class="temper-panel" aria-hidden="true">
            <div class="temper-row temper-wo"><span>WO</span><div class="temper-track"><div class="temper-fill"></div></div></div>
            <div class="temper-row temper-fc"><span>FC</span><div class="temper-track"><div class="temper-fill"></div></div></div>
            <div class="temper-row temper-dr"><span>DR</span><div class="temper-track"><div class="temper-fill"></div></div></div>
            <div class="temper-row temper-ma"><span>MA</span><div class="temper-track"><div class="temper-fill"></div></div></div>
          </div>
          <div class="bin-label">03</div>
          <div class="bin-meter">
            <div class="bin-fill"></div>
            <span class="bin-value">76%</span>
          </div>
        </div>

        <div class="refinement-bin" data-bin="04" data-progress="60">
          <div class="temper-panel" aria-hidden="true">
            <div class="temper-row temper-wo"><span>WO</span><div class="temper-track"><div class="temper-fill"></div></div></div>
            <div class="temper-row temper-fc"><span>FC</span><div class="temper-track"><div class="temper-fill"></div></div></div>
            <div class="temper-row temper-dr"><span>DR</span><div class="temper-track"><div class="temper-fill"></div></div></div>
            <div class="temper-row temper-ma"><span>MA</span><div class="temper-track"><div class="temper-fill"></div></div></div>
          </div>
          <div class="bin-label">04</div>
          <div class="bin-meter">
            <div class="bin-fill"></div>
            <span class="bin-value">60%</span>
          </div>
        </div>
      </div>

      <div class="system-code">0xFF5493 : 0x54DF8A</div>
    </footer>
  </main>

  <script src="script.js?v=13"></script>
</body>
</html>
